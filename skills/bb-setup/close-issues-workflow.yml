# PR 合進 {{pr_base}} 時，關掉 PR 內文用 Closes / Fixes / Resolves #N 指到的 issue。
# 為什麼需要它：GitHub 內建的 closing keyword 只在 PR 開到 repo 的 default branch 時生效，
# 而這個 repo 的 PR 開到 {{pr_base}}（見 .claude/bombolt.md）。
# 由 /bombolt:bb-setup 產生，正本是 bombolt 的 skills/bb-setup/close-issues-workflow.yml。
name: close issues on {{pr_base}}

on:
  pull_request:
    types: [closed]
    branches: [{{pr_base}}]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const nums = [...new Set([...(pr.body || '').matchAll(re)].map(m => Number(m[1])))];
            const failed = [];
            for (const n of nums) {
              try {  // 一個號碼打錯（404）不可以讓後面的 issue 都關不到
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n });
                if (issue.pull_request || issue.state === 'closed') continue;
                await github.rest.issues.createComment({ ...context.repo, issue_number: n,
                  body: `🤖 PR #${pr.number} 已合進 \`${pr.base.ref}\`，自動關閉。` });
                await github.rest.issues.update({ ...context.repo, issue_number: n,
                  state: 'closed', state_reason: 'completed' });
                core.info(`closed #${n}`);
              } catch (e) {
                failed.push(n);
                core.warning(`#${n}: ${e.message}`);
              }
            }
            if (failed.length) core.setFailed(`沒關成：${failed.map(n => '#' + n).join(' ')}`);
